{% extends 'base.html' %}
{% block title %}SamStudy • 3-D Learning{% endblock %}
{% block content %}
<section class="pageSection authPage" data-auth-page="true" id="threePage">
  <p class="eyebrow">3-D LEARNING</p>
  <h2>Visual learning space.</h2>
  <div class="threePanel">
    <div class="threeLogo"><img src="{{ url_for('static', filename='logo.png') }}" alt="SamStudy 3-D logo"></div>
    <div>
      <h3>Interactive 3-D Learning</h3>
      <p>Choose a module and start learning visually.</p>
      <div class="threeCards">
        <button type="button" onclick="open3D('Physics')">⚛ Physics</button>
        <button type="button" onclick="open3D('Chemistry')">🧪 Chemistry</button>
        <button type="button" onclick="open3D('Engineering')">⚙ Engineering</button>
        <button type="button" onclick="open3D('Biology')">🧬 Biology</button>
      </div>
      <div id="threeOut" class="output">Select a module.</div>
    </div>
  </div>
</section>
{% endblock %}
