<div id="adminModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="modalCard admin">
    <button class="close" type="button" onclick="closeAdmin()" aria-label="Close">×</button>
    <h2 id="adminTitle">Developer Console</h2>
    <p id="adminUser"></p>
    <h3>Add Batch</h3>
    <div class="grid2"><select id="ayear"><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select><input id="aname" placeholder="Batch name"></div>
    <input id="adesc" placeholder="Description">
    <button class="primary" type="button" onclick="addBatch()">Add Batch</button>
    <h3>Add Notes / Content</h3>
    <select id="abatch"></select><input id="asubject" placeholder="Subject"><input id="aunit" placeholder="Unit (e.g. Unit 1) or All Units"><input id="atitle" placeholder="Note title"><textarea id="adetails" placeholder="Detailed note description / contents"></textarea><input id="afile" type="file"><input id="aurl" placeholder="Optional external URL">
    <button class="primary" type="button" onclick="addNote()">Upload / Add Content</button>
    <p id="adminMsg"></p>
  </div>
</div>
