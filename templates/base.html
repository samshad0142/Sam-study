<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#38bdf8"
  >

  <title>
    {% block title %}SamStudy{% endblock %}
  </title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >


  <!-- Firebase -->

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script
    src="{{ url_for('static', filename='firebase-client.js') }}"
    defer
  ></script>

  <script
    src="{{ url_for('static', filename='app.js') }}"
    defer
  ></script>

</head>


<body>


<header class="site-header">

  <a
    class="brand"
    href="/"
    aria-label="SamStudy home"
  >

    <span class="brand-ss">SS</span>

    <span class="brand-name">
      Sam<span>Study</span>
    </span>

  </a>


  <nav class="main-nav">

    <a href="/">Home</a>

    <a href="/batches">Batches</a>

    <a href="/notes">Notes</a>

    <a href="/quiz">Quiz</a>

    <a href="/3d">3-D</a>

    <a href="/doubt">Doubt</a>

  </nav>


  <div class="header-actions">


    <!-- Theme -->

    <button
      class="icon-btn"
      id="themeToggle"
      title="Toggle night mode"
      type="button"
    >
      ☼
    </button>


    <!-- Logged OUT -->

    <a
      id="loginLink"
      class="btn-primary"
      href="/login"
    >
      Login
    </a>


    <!-- Logged IN -->

    <a
      id="profileLink"
      class="profile-header-btn hidden"
      href="/profile"
      title="My Profile"
    >

      <span id="headerProfilePhoto">
        👤
      </span>

      <span class="profile-header-text">
        Profile
      </span>

    </a>


  </div>

</header>


<main class="page-shell">

  {% block content %}
  {% endblock %}

</main>


<footer class="footer">

  <div class="footer-brand">

    <span class="footer-ss">
      SS
    </span>

    Sam<span>Study</span>

  </div>

  <div class="toast" id="toast"></div>

</footer>



<style>

/* Profile button */

.profile-header-btn {

  display: flex;

  align-items: center;

  gap: 9px;

  padding: 10px 16px;

  border-radius: 14px;

  text-decoration: none;

  color: #fff;

  background: rgba(20,160,225,.18);

  border: 1px solid rgba(70,190,255,.35);

  font-weight: 800;

}


.profile-header-btn:hover {

  background: rgba(20,160,225,.32);

}


#headerProfilePhoto {

  width: 32px;

  height: 32px;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  background: linear-gradient(
    135deg,
    #159fe0,
    #6948e8
  );

}


#headerProfilePhoto img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


/* Hidden */

.hidden {

  display: none !important;

}


/* Mobile */

@media (max-width: 600px) {

  .profile-header-text {

    display: none;

  }

  .profile-header-btn {

    padding: 8px 11px;

  }

}

</style>


</body>

</html>
