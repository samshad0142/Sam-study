<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#0b8ed1">

  <title>{% block title %}SamStudy{% endblock %}</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script
    src="{{ url_for('static', filename='firebase-client.js') }}"
    defer>
  </script>

  <script
    src="{{ url_for('static', filename='app.js') }}"
    defer>
  </script>

</head>


<body>

<header class="site-header">

  <!-- LOGO / HOME -->

  <a
    class="brand"
    href="/"
    aria-label="SamStudy home">

    <!-- Your SamStudy logo -->
    <img
      class="brand-logo"
      src="{{ url_for('static', filename='logo.png') }}"
      alt="SamStudy">

    <span class="brand-name">
      Sam<span>Study</span>
    </span>

  </a>


  <!-- NAVIGATION -->

  <nav class="main-nav">

    <a href="/">Home</a>

    <a href="/batches">Batches</a>

    <a href="/notes">Notes</a>

    <a href="/quiz">Quiz</a>

    <a href="/3d">3-D</a>

    <a href="/doubt">Doubt</a>

  </nav>


  <!-- HEADER ACTIONS -->

  <div class="header-actions">

    <!-- THEME -->

    <button
      class="icon-btn"
      id="themeToggle"
      title="Toggle night mode"
      type="button">
      ☼
    </button>


    <!-- LOGGED OUT -->

    <a
      id="loginLink"
      class="header-login"
      href="/login">
      Login / Sign up
    </a>


    <!-- LOGGED IN -->

    <a
      id="profileLink"
      class="profile-header-btn hidden"
      href="/profile"
      title="My Profile">

      <span id="headerProfilePhoto">
        👤
      </span>

      <span id="headerProfileName">
        Profile
      </span>

    </a>

  </div>

</header>


<main class="page-shell">

  {% block content %}{% endblock %}

</main>


<footer class="footer">

  <div class="footer-brand">

    <img
      class="footer-logo"
      src="{{ url_for('static', filename='logo.png') }}"
      alt="SamStudy">

    Sam<span>Study</span>

  </div>

  <div class="toast" id="toast"></div>

</footer>


<style>

/* ============================= */
/* SAMSTUDY LOGO */
/* ============================= */

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.brand-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 12px;
}

.brand-name {
  font-weight: 900;
}

.brand-name span {
  color: #159edb;
}


/* ============================= */
/* PROFILE HEADER */
/* ============================= */

.profile-header-btn {

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 8px 14px;

  border-radius: 14px;

  text-decoration: none;

  color: white;

  background:
    linear-gradient(
      135deg,
      #159edb,
      #3d70e8
    );

  font-weight: 800;

  border: 1px solid
    rgba(255,255,255,.15);

}


/* PROFILE PHOTO */

#headerProfilePhoto {

  width: 34px;

  height: 34px;

  border-radius: 50%;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(255,255,255,.18);

  font-size: 19px;

}

#headerProfilePhoto img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


/* PROFILE NAME */

#headerProfileName {
  white-space: nowrap;
}


/* ============================= */
/* LOGIN */
/* ============================= */

.header-login {

  padding: 13px 20px;

  border-radius: 14px;

  text-decoration: none;

  color: white;

  background:
    linear-gradient(
      135deg,
      #159edb,
      #287de0
    );

  font-weight: 800;

}


/* ============================= */
/* HIDDEN */
/* ============================= */

.hidden {
  display: none !important;
}


/* ============================= */
/* FOOTER LOGO */
/* ============================= */

.footer-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.footer-logo {

  width: 32px;

  height: 32px;

  object-fit: contain;

  border-radius: 8px;

}


/* ============================= */
/* MOBILE */
/* ============================= */

@media (max-width: 650px) {

  .brand-logo {
    width: 42px;
    height: 42px;
  }

  .profile-header-btn {
    padding: 7px 10px;
  }

  #headerProfileName {
    display: none;
  }

  .header-login {
    padding: 11px 14px;
  }

}

</style>


<script>

/* ==========================================
   SAMSTUDY HEADER AUTHENTICATION
   ========================================== */

(function () {

  function startHeaderAuth() {

    if (!window.samAuth) {

      setTimeout(
        startHeaderAuth,
        300
      );

      return;
    }


    const auth = window.samAuth;


    const loginLink =
      document.getElementById(
        "loginLink"
      );


    const profileLink =
      document.getElementById(
        "profileLink"
      );


    const profilePhoto =
      document.getElementById(
        "headerProfilePhoto"
      );


    const profileName =
      document.getElementById(
        "headerProfileName"
      );


    /*
     * AUTH STATE
     */

    auth.onAuthStateChanged(
      async function (user) {

        if (user) {

          /*
           * USER IS LOGGED IN
           */

          if (loginLink) {
            loginLink.classList.add(
              "hidden"
            );
          }


          if (profileLink) {
            profileLink.classList.remove(
              "hidden"
            );
          }


          /*
           * PROFILE NAME
           */

          let name =
            user.displayName ||
            "Profile";


          /*
           * LOAD FIRESTORE PROFILE
           */

          try {

            const db =
              firebase.firestore();

            const snap =
              await db
                .collection("users")
                .doc(user.uid)
                .get();


            if (snap.exists) {

              const data =
                snap.data();


              if (data.name) {
                name = data.name;
              }


              /*
               * PROFILE PHOTO
               */

              if (data.photoURL) {

                profilePhoto.innerHTML =
                  '<img src="' +
                  escapeHtml(data.photoURL) +
                  '" alt="Profile">';

              }

            }

          } catch (error) {

            console.log(
              "Profile header:",
              error
            );

          }


          if (profileName) {

            profileName.textContent =
              name;

          }


          /*
           * FALLBACK PHOTO
           */

          if (
            !profilePhoto.innerHTML ||
            profilePhoto.innerHTML === "👤"
          ) {

            if (user.photoURL) {

              profilePhoto.innerHTML =
                '<img src="' +
                escapeHtml(user.photoURL) +
                '" alt="Profile">';

            }

          }

        }

        else {

          /*
           * USER IS LOGGED OUT
           */

          if (loginLink) {

            loginLink.classList.remove(
              "hidden"
            );

          }


          if (profileLink) {

            profileLink.classList.add(
              "hidden"
            );

          }

        }

      }
    );


    /*
     * SECURITY
     */

    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  }


  startHeaderAuth();

})();

</script>


{% block scripts %}{% endblock %}

</body>

</html>
