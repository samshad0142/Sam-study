{% extends "base.html" %}

{% block title %}Profile • SamStudy{% endblock %}

{% block content %}

<section class="profile-page">

  <div class="profile-card">

    <div class="profile-head">
      <span class="profile-label">SAMSTUDY PROFILE</span>
      <h1>My Profile</h1>
      <p>Manage your student information</p>
    </div>

    <form id="profileForm">

      <!-- PROFILE PHOTO -->

      <div class="profile-photo-section">

        <div class="profile-photo" id="profilePhoto">
          👤
        </div>

        <label class="photo-btn">
          📷 Change Photo
          <input
            type="file"
            id="photoInput"
            accept="image/*"
            hidden
          >
        </label>

        <small>
          Select a photo from Gallery or Camera
        </small>

      </div>


      <!-- STUDENT NAME -->

      <div class="profile-form">

        <label for="studentName">
          Student Name
        </label>

        <input
          id="studentName"
          type="text"
          placeholder="Enter your student name"
          autocomplete="name"
        >


        <!-- COURSE -->

        <label for="course">
          Course / Education
        </label>

        <select id="course">

          <option value="">
            Select course
          </option>

          <option>B.Tech</option>
          <option>BCA</option>
          <option>MCA</option>
          <option>M.Tech</option>
          <option>B.Pharm</option>
          <option>B.Sc</option>
          <option>Other</option>

        </select>


        <!-- BRANCH -->

        <label for="branch">
          Branch / Stream
        </label>

        <input
          id="branch"
          type="text"
          placeholder="Example: Computer Science & Engineering"
        >


        <!-- EXAM -->

        <label for="exam">
          Government / Competitive Exam
          <span>(Optional)</span>
        </label>

        <select id="exam">

          <option value="">
            None / Not preparing
          </option>

          <option>GATE</option>
          <option>SSC</option>
          <option>Railway</option>
          <option>UPSC</option>
          <option>Army</option>
          <option>NEET UG</option>
          <option>NEET PG</option>
          <option>JEE Mains</option>
          <option>JEE Advanced</option>
          <option>Other</option>

        </select>


        <!-- GMAIL -->

        <label>
          Gmail
        </label>

        <div class="email-box">

          <input
            id="profileEmail"
            type="email"
            readonly
            placeholder="Your Gmail"
          >

          <span id="emailVerificationStatus">
            Checking...
          </span>

        </div>


        <button
          type="button"
          id="verifyEmail"
          class="verify-btn hidden"
        >
          Send Gmail Verification
        </button>


        <!-- SAVE -->

        <button
          type="submit"
          id="saveProfile"
          class="save-profile-btn"
        >
          Save Profile
        </button>

        <p
          id="profileMessage"
          class="profile-message"
        ></p>

      </div>

    </form>


    <!-- LOGOUT -->

    <div class="logout-section">

      <button
        type="button"
        id="profileLogout"
        class="logout-red"
      >
        Logout
      </button>

    </div>

  </div>

</section>


<style>

.profile-page {
  max-width: 720px;
  margin: 40px auto;
  padding: 20px;
}

.profile-card {
  padding: 30px;
  border-radius: 28px;
  background: rgba(5,25,42,.92);
  border: 1px solid rgba(80,190,255,.3);
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.profile-head h1 {
  margin: 8px 0;
  font-size: 38px;
}

.profile-head p {
  margin: 0 0 25px;
  opacity: .75;
}

.profile-label {
  color: #55c9ff;
  font-weight: 800;
  letter-spacing: 2px;
  font-size: 13px;
}


/* PHOTO */

.profile-photo-section {
  text-align: center;
  margin: 25px 0 35px;
}

.profile-photo {
  width: 125px;
  height: 125px;
  margin: auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 55px;
  background: linear-gradient(
    135deg,
    #119bd7,
    #6848e8
  );
  border: 4px solid rgba(255,255,255,.15);
}

.profile-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 20px;
  border-radius: 12px;
  cursor: pointer;
  background: #149fdf;
  color: white;
  font-weight: 700;
}

.profile-photo-section small {
  display: block;
  margin-top: 8px;
  opacity: .6;
}


/* FORM */

.profile-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.profile-form label {
  margin-top: 12px;
  font-weight: 700;
}

.profile-form label span {
  opacity: .55;
  font-weight: 400;
}

.profile-form input,
.profile-form select {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid rgba(100,200,255,.25);
  background: rgba(10,35,55,.8);
  color: inherit;
  font-size: 16px;
  box-sizing: border-box;
}

.profile-form select option {
  color: black;
}


/* EMAIL */

.email-box {
  display: flex;
  gap: 10px;
  align-items: center;
}

.email-box input {
  flex: 1;
}

#emailVerificationStatus {
  white-space: nowrap;
  font-size: 13px;
  font-weight: 700;
}


/* VERIFICATION */

.verify-btn {
  margin-top: 5px;
  padding: 12px;
  border: 1px solid #55c9ff;
  border-radius: 12px;
  background: transparent;
  color: #55c9ff;
  font-weight: 700;
  cursor: pointer;
}


/* SAVE */

.save-profile-btn {
  margin-top: 25px;
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #16a4e5;
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.save-profile-btn:active {
  transform: scale(.99);
}


/* MESSAGE */

.profile-message {
  text-align: center;
  min-height: 20px;
}


/* LOGOUT */

.logout-section {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid rgba(255,255,255,.12);
  text-align: center;
}

.logout-red {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #ff4d5a;
  background: transparent;
  color: #ff4d5a;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.logout-red:hover {
  background: #ff4d5a;
  color: white;
}

.hidden {
  display: none !important;
}


/* MOBILE */

@media (max-width: 600px) {

  .profile-page {
    margin: 15px auto;
    padding: 12px;
  }

  .profile-card {
    padding: 20px;
    border-radius: 22px;
  }

  .profile-head h1 {
    font-size: 30px;
  }

  .email-box {
    display: block;
  }

  #emailVerificationStatus {
    display: block;
    margin-top: 7px;
  }

}

</style>

{% endblock %}
