<section id="quiz">
  <p class="eyebrow">AI QUIZ</p>
  <h2>Fresh PYQ-focused quiz.</h2>
  <div class="controls five">
    <select id="qcourse" aria-label="Course"><option>B.Tech</option><option>BCA</option><option>MCA</option><option>M.Tech</option><option>B.Pharm</option><option>B.Sc</option></select>
    <select id="qexam" aria-label="Exam"></select>
    <input id="qsubject" placeholder="Subject e.g. Physics / DBMS / Maths" aria-label="Quiz subject">
    <select id="qlevel" aria-label="Difficulty"><option>Mixed</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
    <select id="qcount" aria-label="Question count"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option></select>
    <button class="primary" type="button" onclick="generateQuiz()">Generate Quiz</button>
  </div>
  <div id="quizOut" class="output">Choose course, exam, subject and question count.</div>
</section>
