<section id="tests">
  <p class="eyebrow">REAL-EXAM PRACTICE TEST</p>
  <h2>Attempt a full-style test.</h2>
  <div class="controls five">
    <select id="tcourse" aria-label="Test course"><option>B.Tech</option><option>BCA</option><option>MCA</option><option>M.Tech</option><option>B.Pharm</option><option>B.Sc</option></select>
    <select id="texam" aria-label="Test exam"></select>
    <input id="tsubject" placeholder="Subject / paper" aria-label="Test subject">
    <select id="tdifficulty" aria-label="Test difficulty"><option>Real exam</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
    <select id="tcount" aria-label="Test question count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select>
    <button class="primary" type="button" onclick="generateTest()">Start Test</button>
  </div>
  <div id="testOut" class="output">Select your exam and start a timed practice test.</div>
</section>
