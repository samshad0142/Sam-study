{% extends "base.html" %}

{% block title %}Smart Quiz • SamStudy{% endblock %}

{% block content %}

<section class="page-title">
  <span class="eyebrow sky">AI QUIZ ENGINE</span>

  <h1>Build your test.</h1>

  <p>
    Choose your course, exam, subject, difficulty and
    number of questions.
  </p>
</section>


<!-- ================= QUIZ BUILDER ================= -->

<div class="quiz-builder card">

  <!-- COURSE -->

  <label>
    Course / Education

    <select id="quizCourse">

      <option value="B.Tech">B.Tech</option>
      <option value="BCA">BCA</option>
      <option value="MCA">MCA</option>
      <option value="M.Tech">M.Tech</option>
      <option value="B.Pharm">B.Pharm</option>
      <option value="B.Sc">B.Sc</option>

    </select>

  </label>


  <!-- YEAR -->

  <label>
    Year / Class

    <select id="quizYear">

      <option value="1">1st Year</option>
      <option value="2">2nd Year</option>
      <option value="3">3rd Year</option>
      <option value="4">4th Year</option>

      <option value="11">Class 11</option>
      <option value="12">Class 12</option>

    </select>

  </label>


  <!-- EXAM -->

  <label>
    Exam

    <select id="quizExam">

      <option value="AKTU">AKTU</option>

      <option value="GATE">GATE</option>

      <option value="SSC">SSC</option>

      <option value="Railway">Railway</option>

      <option value="UPSC">UPSC</option>

      <option value="Army">Army</option>

      <option value="NEET UG">NEET UG</option>

      <option value="NEET PG">NEET PG</option>

      <option value="JEE Mains">JEE Mains</option>

      <option value="JEE Advanced">JEE Advanced</option>

      <option value="Other Government Exam">
        Other Government Exam
      </option>

    </select>

  </label>


  <!-- SUBJECT -->

  <label>
    Subject

    <select id="quizSubject">

      <option value="">
        Select subject
      </option>

    </select>

  </label>


  <!-- DIFFICULTY -->

  <label>
    Difficulty

    <select id="quizLevel">

      <option value="Beginner">
        Beginner
      </option>

      <option value="Intermediate">
        Intermediate
      </option>

      <option value="Advanced">
        Advanced
      </option>

      <option value="Exam Level">
        Exam Level
      </option>

      <option value="PYQ Style">
        PYQ Style
      </option>

    </select>

  </label>


  <!-- QUESTION COUNT -->

  <label>
    Number of Questions

    <select id="countSelect">

      <option value="5">5 Questions</option>

      <option value="10">10 Questions</option>

      <option value="20">20 Questions</option>

      <option value="30">30 Questions</option>

      <option value="50">50 Questions</option>

    </select>

  </label>


  <!-- GENERATE -->

  <button
    id="generateQuiz"
    type="button"
    class="btn btn-primary wide">

    Generate Test ✦

  </button>

</div>


<!-- ================= QUIZ AREA ================= -->

<div
  id="quizArea"
  class="quiz-area hidden">
</div>


<!-- ================= RESULT AREA ================= -->

<div
  id="quizResult"
  class="quiz-result hidden">
</div>


<style>

/* ================= BUILDER ================= */

.quiz-builder {

  max-width: 850px;

  margin: 30px auto;

  padding: 28px;

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 20px;

}


.quiz-builder label {

  display: flex;

  flex-direction: column;

  gap: 8px;

  font-weight: 800;

}


.quiz-builder select {

  width: 100%;

  padding: 14px;

  border-radius: 13px;

  border:
    1px solid
    rgba(100,200,255,.25);

  background:
    rgba(10,35,55,.8);

  color: inherit;

  font-size: 16px;

}


.quiz-builder select option {

  color: black;

}


.quiz-builder .wide {

  grid-column: 1 / -1;

}


/* ================= QUIZ ================= */

.quiz-area {

  max-width: 850px;

  margin: 30px auto;

}


.quiz-top {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  margin-bottom: 20px;

  padding: 18px;

  border-radius: 18px;

  background:
    rgba(10,35,55,.8);

  border:
    1px solid
    rgba(80,190,255,.25);

}


.question-progress {

  font-weight: 900;

}


.question-card {

  padding: 28px;

  border-radius: 22px;

  background:
    rgba(5,25,42,.94);

  border:
    1px solid
    rgba(80,190,255,.25);

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.2);

}


.question-number {

  color: #55c9ff;

  font-weight: 900;

  letter-spacing: 1px;

  font-size: 13px;

  margin-bottom: 10px;

}


.question-card h2 {

  line-height: 1.5;

  margin-bottom: 25px;

}


.quiz-option {

  display: block;

  padding: 16px;

  margin: 12px 0;

  border-radius: 14px;

  border:
    1px solid
    rgba(120,200,255,.2);

  background:
    rgba(20,50,70,.55);

  cursor: pointer;

  transition: .2s;

}


.quiz-option:hover {

  border-color:
    #55c9ff;

  transform:
    translateY(-1px);

}


.quiz-option input {

  margin-right: 10px;

}


/* ================= ANSWER COLORS ================= */

.quiz-option.correct {

  background:
    rgba(34,197,94,.18);

  border:
    2px solid
    #22c55e;

}


.quiz-option.wrong {

  background:
    rgba(239,68,68,.18);

  border:
    2px solid
    #ef4444;

}


.correct-text {

  color:
    #35d07f;

  font-weight:
    800;

}


.wrong-text {

  color:
    #ff5964;

  font-weight:
    800;

}


/* ================= CONTROLS ================= */

.quiz-controls {

  display: flex;

  justify-content: space-between;

  gap: 12px;

  margin-top: 25px;

  flex-wrap: wrap;

}


.quiz-controls button {

  min-width: 130px;

}


.next-question {

  background:
    #159edb;

  color: white;

  border: 0;

  padding: 13px 22px;

  border-radius: 12px;

  font-weight: 800;

}


.submit-test {

  background:
    transparent;

  color:
    #ff5964;

  border:
    1px solid
    #ff5964;

  padding: 13px 22px;

  border-radius: 12px;

  font-weight: 800;

}


.submit-test:hover {

  background:
    #ff5964;

  color: white;

}


/* ================= EXPLANATION ================= */

.answer-explanation {

  margin-top: 22px;

  padding: 18px;

  border-radius: 15px;

  background:
    rgba(50,100,130,.2);

  border-left:
    4px solid
    #55c9ff;

  line-height: 1.7;

}


/* ================= RESULT ================= */

.quiz-result {

  max-width: 850px;

  margin: 30px auto;

  padding: 30px;

  text-align: center;

  border-radius: 24px;

  background:
    rgba(5,25,42,.94);

  border:
    1px solid
    rgba(80,190,255,.3);

}


.result-score {

  font-size: 48px;

  font-weight: 900;

  color:
    #55c9ff;

}


.result-stat {

  margin: 8px;

  font-size: 17px;

}


/* ================= MOBILE ================= */

@media(max-width:650px) {

  .quiz-builder {

    grid-template-columns: 1fr;

    padding: 20px;

  }

  .quiz-builder .wide {

    grid-column: auto;

  }

  .question-card {

    padding: 20px;

  }

  .quiz-top {

    flex-direction: column;

    align-items: flex-start;

  }

  .quiz-controls {

    flex-direction: column;

  }

  .quiz-controls button {

    width: 100%;

  }

}

</style>

{% endblock %}
