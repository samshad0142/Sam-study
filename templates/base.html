<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#0b8ed1">

  <title>{% block title %}SamStudy{% endblock %}</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script
    src="{{ url_for('static', filename='firebase-client.js') }}"
    defer>
  </script>

  <script
    src="{{ url_for('static', filename='app.js') }}"
    defer>
  </script>

</head>


<body>

<header class="site-header">

  <!-- LOGO / HOME -->

  <a
    class="brand"
    href="/"
    aria-label="SamStudy home"
  >

    <span class="brand-ss">SS</span>

    <span class="brand-name">
      Sam<span>Study</span>
    </span>

  </a>


  <!-- NAVIGATION -->

  <nav class="main-nav">

    <a href="/">Home</a>

    <a href="/batches">Batches</a>

    <a href="/notes">Notes</a>

    <a href="/quiz">Quiz</a>

    <a href="/3d">3-D</a>

    <a href="/doubt">Doubt</a>

  </nav>


  <!-- HEADER ACTIONS -->

  <div class="header-actions">

    <!-- Theme -->

    <button
      class="icon-btn"
      id="themeToggle"
      title="Toggle night mode"
      type="button">
      ☼
    </button>


    <!-- Logged OUT -->

    <a
      id="loginLink"
      class="header-login"
      href="/login">
      Login
    </a>


    <!-- Logged IN -->

    <a
      id="profileLink"
      class="profile-header-btn hidden"
      href="/profile"
      title="My Profile">

      <span id="headerProfilePhoto">
        👤
      </span>

      <span>Profile</span>

    </a>


    <!-- Logout intentionally NOT shown here -->

    <button
      id="logoutBtn"
      class="hidden"
      type="button">
      Logout
    </button>

  </div>

</header>


<main class="page-shell">

  {% block content %}{% endblock %}

</main>


<footer class="footer">

  <div class="footer-brand">

    <span class="footer-ss">
      SS
    </span>

    Sam<span>Study</span>

  </div>

  <div class="toast" id="toast"></div>

</footer>


<style>

/* PROFILE HEADER */

.profile-header-btn {

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 11px 17px;

  border-radius: 14px;

  text-decoration: none;

  color: white;

  background:
    linear-gradient(
      135deg,
      #159edb,
      #3d70e8
    );

  font-weight: 800;

  border: 1px solid
    rgba(255,255,255,.15);

}


/* HEADER PROFILE PHOTO */

#headerProfilePhoto {

  width: 30px;

  height: 30px;

  border-radius: 50%;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(255,255,255,.18);

  font-size: 18px;

}

#headerProfilePhoto img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


/* LOGIN */

.header-login {

  padding: 13px 24px;

  border-radius: 14px;

  text-decoration: none;

  color: white;

  background:
    linear-gradient(
      135deg,
      #159edb,
      #287de0
    );

  font-weight: 800;

}


/* HIDDEN */

.hidden {

  display: none !important;

}


/* MOBILE */

@media (max-width: 650px) {

  .profile-header-btn {

    padding: 10px 13px;

  }

  .profile-header-btn span:last-child {

    display: none;

  }

  .header-login {

    padding: 11px 17px;

  }

}

</style>


{% block scripts %}{% endblock %}

</body>

</html>
