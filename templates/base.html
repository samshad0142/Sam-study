<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#38bdf8">

    <title>{% block title %}SamStudy{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <script src="{{ url_for('static', filename='firebase-client.js') }}"
            defer></script>

    <script src="{{ url_for('static', filename='app.js') }}"
            defer></script>
</head>

<body>

<header class="site-header">

    <a class="brand" href="/" aria-label="SamStudy home">

        <!-- Your supplied SamStudy logo -->
        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="SamStudy"
            class="brand-logo"
        >

        <span class="brand-name">
            <span class="brand-sam">Sam</span><span>Study</span>
        </span>

    </a>

    <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/batches">Batches</a>
        <a href="/notes">Notes</a>
        <a href="/quiz">Quiz</a>
        <a href="/3d">3-D</a>
        <a href="/doubt">Doubt</a>
        <a href="/test">Test</a>
    </nav>

    <div class="header-actions">

        <!-- Theme button -->
        <button
            id="themeToggle"
            class="icon-btn"
            title="Toggle night mode"
            type="button">
            ☼
        </button>

        <!-- Shown when user is NOT logged in -->
        <a
            id="loginLink"
            class="btn btn-primary"
            href="/login">
            Login
        </a>

        <!-- Shown when user IS logged in -->
        <a
            id="profileLink"
            class="profile-mini hidden"
            href="/profile"
            title="Profile">

            <span id="profileAvatar">
                👤
            </span>

            <span id="profileName">
                Profile
            </span>

        </a>

    </div>

</header>


<main class="page-shell">
    {% block content %}{% endblock %}
</main>


<footer class="footer">

    <div class="footer-brand">
        <span>SS</span>
        Sam<span>Study</span>
    </div>

    <div>
        Learn • Practice • Master
    </div>

</footer>


<div id="toast" class="toast"></div>

</body>
</html>
