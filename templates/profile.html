{% extends "base.html" %}

{% block title %}Profile • SamStudy{% endblock %}

{% block content %}

<section class="profile-page">

  <div class="profile-card">

    <div class="profile-head">
      <span class="profile-label">SAMSTUDY PROFILE</span>
      <h1>My Profile</h1>
      <p>Manage your student information</p>
    </div>

    <!-- PROFILE PHOTO -->

    <div class="profile-photo-section">

      <div class="profile-photo" id="profilePhoto">
        👤
      </div>

      <label class="photo-btn">
        📷 Change Photo

        <input
          type="file"
          id="photoInput"
          accept="image/*"
          capture="user"
          hidden
        >
      </label>

      <small>
        Choose photo from gallery or camera
      </small>

    </div>


    <!-- PROFILE DETAILS -->

    <div class="profile-form">

      <label>Student Name</label>

      <input
        id="studentName"
        type="text"
        placeholder="Enter student name"
      >


      <label>Course / Education</label>

      <select id="course">

        <option value="">Select course</option>

        <option>B.Tech</option>
        <option>BCA</option>
        <option>MCA</option>
        <option>M.Tech</option>
        <option>B.Pharm</option>
        <option>B.Sc</option>
        <option>Other</option>

      </select>


      <label>Branch / Stream</label>

      <input
        id="branch"
        type="text"
        placeholder="Example: Computer Science & Engineering"
      >


      <label>
        Government / Competitive Exam
        <span>(Optional)</span>
      </label>

      <select id="exam">

        <option value="">
          None / Not preparing
        </option>

        <option>GATE</option>
        <option>SSC</option>
        <option>Railway</option>
        <option>UPSC</option>
        <option>Army</option>
        <option>NEET UG</option>
        <option>NEET PG</option>
        <option>JEE Mains</option>
        <option>JEE Advanced</option>
        <option>Other</option>

      </select>


      <!-- GMAIL -->

      <label>Gmail</label>

      <div class="email-box">

        <input
          id="profileEmail"
          type="email"
          readonly
        >

        <span id="verificationStatus">
          Checking...
        </span>

      </div>


      <button
        type="button"
        id="verifyEmailBtn"
        class="verify-btn hidden"
      >
        Send Gmail Verification
      </button>


      <!-- SAVE -->

      <button
        type="button"
        id="saveProfile"
        class="save-profile-btn"
      >
        Save Profile
      </button>

      <p
        id="profileMessage"
        class="profile-message"
      ></p>

    </div>


    <!-- LOGOUT -->

    <div class="logout-section">

      <button
        type="button"
        id="profileLogout"
        class="logout-red"
      >
        Logout
      </button>

    </div>

  </div>

</section>


<style>

.profile-page {
  max-width: 720px;
  margin: 40px auto;
  padding: 20px;
}

.profile-card {
  padding: 30px;
  border-radius: 28px;
  background: rgba(5,25,42,.92);
  border: 1px solid rgba(80,190,255,.3);
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.profile-head h1 {
  margin: 8px 0;
  font-size: 38px;
}

.profile-head p {
  margin: 0 0 25px;
  opacity: .75;
}

.profile-label {
  color: #55c9ff;
  font-weight: 800;
  letter-spacing: 2px;
  font-size: 13px;
}


/* PHOTO */

.profile-photo-section {
  text-align: center;
  margin: 25px 0 35px;
}

.profile-photo {
  width: 125px;
  height: 125px;
  margin: auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 55px;
  background: linear-gradient(
    135deg,
    #119bd7,
    #6848e8
  );
  border: 4px solid rgba(255,255,255,.15);
}

.profile-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 20px;
  border-radius: 12px;
  cursor: pointer;
  background: #149fdf;
  color: white;
  font-weight: 700;
}

.profile-photo-section small {
  display: block;
  margin-top: 8px;
  opacity: .6;
}


/* FORM */

.profile-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.profile-form label {
  margin-top: 12px;
  font-weight: 700;
}

.profile-form label span {
  opacity: .55;
  font-weight: 400;
}

.profile-form input,
.profile-form select {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid rgba(100,200,255,.25);
  background: rgba(10,35,55,.8);
  color: inherit;
  font-size: 16px;
  box-sizing: border-box;
}

.profile-form select option {
  color: black;
}


/* EMAIL */

.email-box {
  display: flex;
  gap: 10px;
  align-items: center;
}

.email-box input {
  flex: 1;
}

#verificationStatus {
  white-space: nowrap;
  font-size: 13px;
  font-weight: 700;
}


/* VERIFY */

.verify-btn {
  margin-top: 5px;
  padding: 12px;
  border: 1px solid #55c9ff;
  border-radius: 12px;
  background: transparent;
  color: #55c9ff;
  font-weight: 700;
  cursor: pointer;
}


/* SAVE */

.save-profile-btn {
  margin-top: 25px;
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #16a4e5;
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}


/* MESSAGE */

.profile-message {
  text-align: center;
  min-height: 20px;
}


/* LOGOUT */

.logout-section {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid rgba(255,255,255,.12);
  text-align: center;
}

.logout-red {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #ff4d5a;
  background: transparent;
  color: #ff4d5a;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.logout-red:hover {
  background: #ff4d5a;
  color: white;
}

.hidden {
  display: none !important;
}


/* MOBILE */

@media (max-width: 600px) {

  .profile-page {
    margin: 15px auto;
    padding: 12px;
  }

  .profile-card {
    padding: 20px;
    border-radius: 22px;
  }

  .profile-head h1 {
    font-size: 30px;
  }

  .email-box {
    display: block;
  }

  #verificationStatus {
    display: block;
    margin-top: 7px;
  }

}

</style>


<script>

(function () {

  function startProfile() {

    if (!window.samAuth) {
      setTimeout(startProfile, 300);
      return;
    }

    const auth = window.samAuth;

    const db = firebase.firestore();

    const storage = firebase.storage();

    let currentUser = null;


    const nameInput =
      document.getElementById("studentName");

    const courseInput =
      document.getElementById("course");

    const branchInput =
      document.getElementById("branch");

    const examInput =
      document.getElementById("exam");

    const emailInput =
      document.getElementById("profileEmail");

    const photoInput =
      document.getElementById("photoInput");

    const photo =
      document.getElementById("profilePhoto");

    const status =
      document.getElementById("verificationStatus");

    const verifyBtn =
      document.getElementById("verifyEmailBtn");

    const message =
      document.getElementById("profileMessage");


    /*
     * AUTH
     */

    auth.onAuthStateChanged(
      async function (user) {

        if (!user) {
          location.href = "/login";
          return;
        }

        currentUser = user;

        emailInput.value =
          user.email || "";

        updateVerification();

        await loadProfile();

      }
    );


    /*
     * EMAIL VERIFICATION
     */

    function updateVerification() {

      if (!currentUser) return;

      if (currentUser.emailVerified) {

        status.textContent =
          "✓ Gmail Verified";

        status.style.color =
          "#35d07f";

        verifyBtn.classList.add(
          "hidden"
        );

      } else {

        status.textContent =
          "Not Verified";

        status.style.color =
          "#ffb020";

        verifyBtn.classList.remove(
          "hidden"
        );

      }

    }


    verifyBtn.onclick =
      async function () {

        if (!currentUser) return;

        try {

          await currentUser
            .sendEmailVerification();

          message.textContent =
            "✓ Verification email sent.";

          message.style.color =
            "#35d07f";

        } catch (e) {

          console.error(e);

          message.textContent =
            "Verification failed.";

          message.style.color =
            "#ff5964";

        }

      };


    /*
     * LOAD FIRESTORE PROFILE
     */

    async function loadProfile() {

      try {

        const ref =
          db
            .collection("users")
            .doc(currentUser.uid);

        const snap =
          await ref.get();

        if (!snap.exists) {

          nameInput.value =
            currentUser.displayName || "";

          return;

        }

        const data = snap.data();

        nameInput.value =
          data.name ||
          currentUser.displayName ||
          "";

        courseInput.value =
          data.course || "";

        branchInput.value =
          data.branch || "";

        examInput.value =
          data.exam || "";

        if (data.photoURL) {
          showPhoto(data.photoURL);
        }

      } catch (e) {

        console.error(
          "Profile load error:",
          e
        );

        message.textContent =
          "Profile could not be loaded.";

        message.style.color =
          "#ff5964";

      }

    }


    /*
     * SHOW PHOTO
     */

    function showPhoto(url) {

      photo.innerHTML =
        "<img src=\"" +
        url +
        "\" alt=\"Profile\">";

    }


    /*
     * PHOTO UPLOAD
     */

    photoInput.onchange =
      async function () {

        const file =
          photoInput.files[0];

        if (!file || !currentUser)
          return;

        if (!file.type.startsWith("image/")) {

          message.textContent =
            "Please select an image.";

          return;

        }

        if (file.size > 5 * 1024 * 1024) {

          message.textContent =
            "Photo must be below 5 MB.";

          message.style.color =
            "#ff5964";

          return;

        }

        message.textContent =
          "Uploading photo...";

        message.style.color =
          "#55c9ff";

        try {

          const ref =
            storage
              .ref(
                "profilePhotos/" +
                currentUser.uid
              );

          await ref.put(file);

          const url =
            await ref.getDownloadURL();

          await db
            .collection("users")
            .doc(currentUser.uid)
            .set(
              {
                photoURL: url
              },
              {
                merge: true
              }
            );

          showPhoto(url);

          message.textContent =
            "✓ Profile photo updated.";

          message.style.color =
            "#35d07f";

        } catch (e) {

          console.error(e);

          message.textContent =
            "Photo upload failed.";

          message.style.color =
            "#ff5964";

        }

      };


    /*
     * SAVE PROFILE
     */

    document.getElementById(
      "saveProfile"
    ).onclick =
      async function () {

        if (!currentUser) return;

        const data = {

          name:
            nameInput.value.trim(),

          course:
            courseInput.value,

          branch:
            branchInput.value.trim(),

          exam:
            examInput.value,

          email:
            currentUser.email || "",

          updatedAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp()

        };


        if (!data.name) {

          message.textContent =
            "Please enter student name.";

          message.style.color =
            "#ff5964";

          return;

        }


        message.textContent =
          "Saving profile...";

        message.style.color =
          "#55c9ff";


        try {

          await db
            .collection("users")
            .doc(currentUser.uid)
            .set(
              data,
              {
                merge: true
              }
            );


          await currentUser
            .updateProfile({

              displayName:
                data.name

            });


          message.textContent =
            "✓ Profile saved successfully.";

          message.style.color =
            "#35d07f";

        } catch (e) {

          console.error(e);

          message.textContent =
            "Profile save failed.";

          message.style.color =
            "#ff5964";

        }

      };


    /*
     * LOGOUT
     */

    document.getElementById(
      "profileLogout"
    ).onclick =
      async function () {

        try {

          await auth.signOut();

          location.href = "/";

        } catch (e) {

          console.error(e);

        }

      };

  }


  startProfile();

})();

</script>

{% endblock %}
